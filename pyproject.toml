[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dfemu"
version = "0.1.0"
description = "Banco de pruebas para los Data Flows de Qlik Cloud: emulador (DuckDB), traductor de scripts y comparador contra el tenant"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["duckdb>=2.0,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-cov>=7,<8"]
docs = ["beautifulsoup4>=4.15,<5", "markdownify>=1.2,<2"]

[project.scripts]
dfemu = "emulator.cli:main"

[tool.setuptools]
packages = ["emulator"]

[tool.setuptools.package-data]
emulator = ["processors.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
