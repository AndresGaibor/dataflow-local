# Origen Postgres (sembrado con transacciones.csv) y destino S3 emulado con MinIO.
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: dfemu, POSTGRES_PASSWORD: dfemu, POSTGRES_DB: origen}
    ports: ["55432:5432"]
    volumes:
      - ./data/practica:/data:ro
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: dfemu, MINIO_ROOT_PASSWORD: dfemu12345}
    ports: ["59000:9000", "59001:9001"]
  minio-init:  # crea el bucket que usan los ejemplos
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set l http://minio:9000 dfemu dfemu12345; do sleep 1; done; mc mb -p l/bucket-datalake; exit 0"
